name: your-portfolio

services:
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: your-portfolio
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      SPOTIFY_LAST_KNOWN_FILE: /app/data/spotify-last-known.json
    volumes:
      - spotify-last-known:/app/data

volumes:
  spotify-last-known:
